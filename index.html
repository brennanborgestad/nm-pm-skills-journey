/* ============================================================
   NM Product Manager Skills Journey — report styles
   Direction C · "Skills Journey" — Product School brand.
   Screen-first, with a dedicated print sheet at the bottom.
   Colors/type come from assets/ps/colors_and_type.css tokens.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #E8E8EA;
  font-family: var(--ps-font-primary);
  color: var(--ps-primary-500);
  -webkit-font-smoothing: antialiased;
}
:root {
  --sheet-w: 1180px;
  --pad-x: 72px;
  --gap-line: var(--ps-neutral-100);
}

/* ---------------- Toolbar (screen only) ---------------- */
.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,24,44,0.94);
  backdrop-filter: blur(10px);
  color: var(--ps-light);
  display: flex; align-items: center; gap: 20px;
  padding: 0 28px; height: 60px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.toolbar .brand { display: flex; align-items: center; gap: 11px; flex: none; }
.toolbar .brand .nm { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.92rem; letter-spacing: -0.01em; }
.toolbar .brand .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.18); }
.toolbar nav { display: flex; gap: 4px; margin-left: 8px; }
.toolbar nav button {
  font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.78rem;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: rgba(252,252,252,0.62); background: transparent; border: 0; cursor: pointer;
  padding: 8px 13px; border-radius: 7px; transition: color .16s, background .16s;
}
.toolbar nav button:hover { color: var(--ps-light); background: rgba(255,255,255,0.07); }
.toolbar nav button.active { color: var(--ps-primary-500); background: var(--ps-accent1-300); }
.toolbar .spacer { flex: 1; }
.toolbar .print-btn {
  font-family: var(--ps-font-secondary); font-weight: 800; font-size: 0.78rem;
  text-transform: uppercase; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent; color: var(--ps-light);
  border: 1px solid rgba(255,255,255,0.28); border-radius: var(--ps-radius-md);
  padding: 9px 16px; cursor: pointer; transition: background .16s, border-color .16s;
}
.toolbar .print-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }

/* ---------------- Sheet ---------------- */
.sheet-wrap { padding: 36px 24px 80px; display: flex; justify-content: center; }
.sheet {
  width: 100%; max-width: var(--sheet-w);
  background: var(--ps-light);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 18px 60px rgba(7,24,44,0.16), 0 2px 8px rgba(7,24,44,0.06);
}
section.report-sec { padding: 64px var(--pad-x); border-top: 1px solid var(--gap-line); scroll-margin-top: 76px; }
.sec-eyebrow {
  font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; font-size: 0.74rem; color: var(--ps-accent1-400); margin: 0 0 14px;
}
.sec-title {
  font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400);
  font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance;
}
.sec-lede { font-size: 1.05rem; line-height: 1.6; color: var(--ps-neutral-500); margin: 0; max-width: 70ch; }

/* ---------------- Cover ---------------- */
.cover {
  position: relative; overflow: hidden;
  background: var(--ps-primary-500); color: var(--ps-light);
  padding: 76px var(--pad-x) 64px;
}
.cover .glow { position: absolute; right: -120px; top: -140px; width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(0,211,173,0.30), transparent 66%); pointer-events: none; }
.cover .glow2 { position: absolute; left: -160px; bottom: -200px; width: 460px; height: 460px;
  background: radial-gradient(circle, rgba(24,43,107,0.7), transparent 70%); pointer-events: none; }
.cover .arches { position: absolute; right: 56px; bottom: -2px; display: flex; align-items: flex-end; gap: 18px; opacity: 0.55; }
.cover .arches i { display: block; border-radius: 9999px 9999px 0 0; border: 2px solid rgba(0,211,173,0.4); border-bottom: 0; }
.cover .arches i:nth-child(1) { width: 64px; height: 120px; }
.cover .arches i:nth-child(2) { width: 88px; height: 188px; border-color: rgba(0,211,173,0.6); }
.cover .arches i:nth-child(3) { width: 56px; height: 96px; opacity: 0.7; }
.cover .inner { position: relative; max-width: 900px; }
.cover .topline { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
.cover .topline .ttl { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.92rem; letter-spacing: -0.01em; }
.cover .eyebrow { font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; font-size: 0.8rem; color: var(--ps-accent1-300); margin: 0 0 22px; }
.cover h1 { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 4.1rem; line-height: 0.98;
  letter-spacing: -0.03em; margin: 0 0 22px; }
.cover h1 em { font-style: normal; color: var(--ps-accent1-300); }
.cover .sub { font-size: 1.2rem; line-height: 1.5; color: rgba(252,252,252,0.78); margin: 0 0 48px; max-width: 60ch; }
.cover .meta { display: flex; gap: 0; border-top: 1px solid rgba(255,255,255,0.16); padding-top: 26px; }
.cover .meta .item { padding-right: 48px; }
.cover .meta .item + .item { padding-left: 48px; border-left: 1px solid rgba(255,255,255,0.16); }
.cover .meta .k { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 2.4rem; line-height: 1; }
.cover .meta .k .den { font-size: 1.1rem; color: rgba(252,252,252,0.5); }
.cover .meta .l { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(252,252,252,0.55); margin-top: 8px; }
.cover .prepared { position: relative; margin-top: 44px; font-size: 0.82rem; color: rgba(252,252,252,0.45); }
.cover .prepared b { color: rgba(252,252,252,0.8); font-weight: 700; }

/* ---------------- Intro + legend ---------------- */
.intro-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 56px; align-items: start; }
.intro-body p { font-size: 1.08rem; line-height: 1.62; color: var(--ps-neutral-500); margin: 0 0 18px; }
.intro-body p:last-child { margin-bottom: 0; }
.intro-body .lead { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 1.22rem; line-height: 1.4; }
.legend { background: var(--ps-neutral-25); border: 1px solid var(--ps-neutral-100); border-radius: 12px; padding: 24px 26px; }
.legend h4 { font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 0.72rem; color: var(--ps-neutral-300); margin: 0 0 16px; }
.legend .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.legend .row + .row { border-top: 1px solid var(--ps-neutral-100); }
.legend .arch { width: 18px; height: 22px; border-radius: 9999px 9999px 0 0; flex: none; }
.legend .ltext { display: flex; flex-direction: column; gap: 2px; }
.legend .nm { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 0.92rem; }
.legend .role { font-size: 0.74rem; color: var(--ps-neutral-300); line-height: 1.3; }
.legend .ct { font-size: 0.72rem; font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-neutral-300); margin-left: auto; white-space: nowrap; align-self: flex-start; }

/* ---------------- Coverage summary — cumulative build ---------------- */
.cov-build { margin-top: 40px; }
.cov-bar { display: flex; gap: 4px; height: 56px; border-radius: 12px; overflow: hidden; }
.cov-bar .seg { position: relative; background: var(--cc); display: flex; align-items: center; justify-content: center; min-width: 30px; }
.cov-bar .seg .seglab { font-family: var(--ps-font-secondary); font-weight: 700; color: #fff; font-size: 0.92rem; letter-spacing: 0.01em; }
.cov-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 22px; }
.step { position: relative; background: var(--ps-neutral-25); border: 1px solid var(--ps-neutral-100);
  border-top: 3px solid var(--cc); border-radius: 12px; padding: 18px 18px 16px; }
.step .dot { display: none; }
.step .snm { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 0.96rem; line-height: 1.2; }
.step .delta { font-size: 0.78rem; color: var(--cc); font-family: var(--ps-font-secondary); font-weight: 700; margin-top: 6px; }
.step.zero .delta { color: var(--ps-neutral-400); }
.step .run { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 1.9rem; line-height: 1; margin-top: 14px; }
.step .run .den { font-size: 0.9rem; color: var(--ps-neutral-200); }

.tier-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
.tcard { background: var(--ps-neutral-25); border: 1px solid var(--ps-neutral-100); border-radius: 12px; padding: 20px 22px; }
.tcard .thead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.tcard .tname { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 1rem; }
.tcard .tcount { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-accent1-400); font-size: 1.4rem; white-space: nowrap; }
.tcard .tcount .den { color: var(--ps-neutral-200); font-size: 0.9rem; }
.tcard .ttrack { display: flex; flex-wrap: wrap; gap: 6px; }
.tcard .ttrack span { font-family: var(--ps-font-secondary); font-weight: 600; font-size: 0.72rem;
  padding: 4px 10px; border-radius: 99px; background: #fff; border: 1px solid var(--ps-neutral-150); color: var(--ps-neutral-500); }

.ai-callout { margin-top: 28px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start;
  background: var(--ps-accent1-50); border: 1px solid var(--ps-accent1-200); border-radius: 12px; padding: 22px 26px; }
.ai-callout .ico { width: 42px; height: 42px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.ai-callout h4 { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-accent1-500); margin: 0 0 5px; font-size: 1.02rem; }
.ai-callout p { margin: 0; font-size: 0.94rem; line-height: 1.55; color: var(--ps-accent1-500); }
.ai-callout p b { font-weight: 700; }

/* ---------------- Filter chips (shared) ---------------- */
.filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 32px; }
.filterbar .lbl { font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 0.7rem; color: var(--ps-neutral-300); margin-right: 4px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.8rem; color: var(--ps-primary-400);
  background: #fff; border: 1.5px solid var(--cc); border-radius: 99px; padding: 7px 14px 7px 11px; transition: opacity .16s, background .16s; }
.fchip .dot { width: 11px; height: 11px; border-radius: 99px; background: var(--cc); flex: none; }
.fchip.off { opacity: 0.4; background: var(--ps-neutral-25); border-color: var(--ps-neutral-150); }
.fchip.off .dot { background: var(--ps-neutral-200); }

/* ---------------- Journey (spine + bands) ---------------- */
.spine { position: relative; padding-left: 46px; }
.spine::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 30px; width: 2px;
  background: linear-gradient(var(--ps-accent1-300), var(--ps-neutral-150)); }
.band { position: relative; margin-bottom: 40px; transition: opacity .2s; }
.band:last-child { margin-bottom: 0; }
.band.dim { opacity: 0.28; }
.band::before { content: ""; position: absolute; left: -39px; top: 6px; width: 20px; height: 20px; border-radius: 99px;
  background: var(--cc); box-shadow: 0 0 0 5px var(--ps-light), 0 0 0 6px var(--ps-neutral-100); }
.band-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.band-head .arch { width: 30px; height: 36px; border-radius: 9999px 9999px 0 0; background: var(--cc); flex: none; }
.band-head .bh-text { flex: 1; }
.band-head .ct { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 1.35rem; color: var(--ps-primary-400); letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.band-head .ai-tag { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--cc); background: var(--ct); padding: 4px 9px; border-radius: 99px; }
.band-head .ai-tag.lens { color: var(--ps-accent1-500); background: var(--ps-accent1-50); }
.band-head .meta { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ps-neutral-300); margin-top: 3px; font-family: var(--ps-font-secondary); font-weight: 700; }
.band-head .cnt { margin-left: auto; font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.78rem;
  color: var(--cc); background: var(--ct); padding: 6px 13px; border-radius: 99px; }
.mod-list { display: grid; gap: 14px; }
.mod-card { display: grid; grid-template-columns: 58px 1fr; gap: 0 20px;
  background: #fff; border: 1px solid var(--ps-neutral-100); border-left: 4px solid var(--cc);
  border-radius: 12px; padding: 22px 26px; transition: box-shadow .16s, transform .16s; }
.mod-card:hover { box-shadow: var(--ps-shadow-card); }
.mod-card .num { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 2.1rem; line-height: 1;
  color: var(--cc); opacity: 0.85; }
.mod-card .num .lab { display: block; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ps-neutral-300); margin-top: 5px; }
.mod-card .crumb { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.68rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--cc); margin: 0 0 5px; }
.mod-card h3 { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 1.22rem; line-height: 1.2;
  color: var(--ps-primary-400); margin: 0 0 9px; letter-spacing: -0.01em; }
.mod-card p { font-size: 0.92rem; line-height: 1.55; color: var(--ps-neutral-400); margin: 0 0 14px; max-width: 64ch; }
.mod-card .skills { display: flex; flex-wrap: wrap; gap: 7px; }
.mod-card .skills span { font-family: var(--ps-font-secondary); font-weight: 600; font-size: 0.74rem;
  padding: 4px 11px; border-radius: 99px; background: var(--ct); color: var(--cc); }
.mod-card .skills span.found { box-shadow: inset 0 0 0 1px var(--cc); background: #fff; }
.reinforce-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 16px;
  background: var(--ps-accent1-50); border: 1px dashed var(--ps-accent1-200); border-radius: 10px; padding: 12px 16px; }
.reinforce-strip .rlab { font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 0.66rem; color: var(--ps-accent1-500); margin-right: 4px; }
.reinforce-strip .rchip { font-family: var(--ps-font-secondary); font-weight: 600; font-size: 0.72rem;
  padding: 4px 10px; border-radius: 99px; background: #fff; color: var(--ps-accent1-500); border: 1px solid var(--ps-accent1-100); }

/* ---------------- Matrix ---------------- */
.matrix-scroll { overflow-x: auto; border: 1px solid var(--ps-neutral-100); border-radius: 12px; }
table.matrix { border-collapse: collapse; width: 100%; }
table.matrix col.labelcol { width: 270px; }
table.matrix col.skillcol { width: 32px; }
.matrix thead .grouprow th { padding: 0 0 0 0; height: 30px; vertical-align: bottom; }
.matrix thead .grouprow .ghead { font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 0.66rem; color: var(--ps-neutral-400); text-align: left; padding: 0 0 6px 4px;
  border-bottom: 2px solid var(--ps-neutral-200); }
.matrix thead .skillrow th { vertical-align: bottom; padding: 0 0 10px; height: 252px; }
.matrix thead .skillrow th.corner { vertical-align: bottom; padding: 0 0 10px 22px; text-align: left;
  font-family: var(--ps-font-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 0.66rem; color: var(--ps-neutral-300); white-space: nowrap; }
.matrix thead .skillrow th .rot { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--ps-font-primary); font-weight: 600; font-size: 0.72rem; color: var(--ps-primary-400);
  white-space: nowrap; line-height: 1.05; cursor: pointer; padding: 2px 0; }
.matrix thead .skillrow th.colhi .rot { color: var(--ps-accent1-500); }
.matrix tbody .certlabel td { padding: 16px 0 8px 22px; }
.matrix tbody .certlabel .cl { display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.82rem; color: var(--ps-primary-400); }
.matrix tbody .certlabel .cl .arch { width: 14px; height: 17px; border-radius: 9999px 9999px 0 0; background: var(--cc); }
.matrix tbody tr.modrow th { text-align: left; font-family: var(--ps-font-primary); font-weight: 600;
  font-size: 0.84rem; color: var(--ps-primary-400); padding: 0 14px 0 22px; white-space: nowrap; max-width: 280px;
  overflow: hidden; text-overflow: ellipsis; }
.matrix tbody tr.modrow th .mn { color: var(--cc); font-weight: 700; font-family: var(--ps-font-secondary); margin-right: 8px; }
.matrix tbody tr.modrow.dim { opacity: 0.24; }
.matrix tbody td.cell { width: 32px; height: 34px; text-align: center; border-left: 1px solid var(--ps-neutral-100);
  border-top: 1px solid var(--ps-neutral-100); position: relative; }
.matrix tbody td.cell.colhi { background: rgba(0,211,173,0.07); }
.matrix tbody tr.modrow.rowhi { background: rgba(0,211,173,0.06); }
.matrix tbody td.cell .mark { display: inline-block; width: 16px; height: 16px; border-radius: 99px; background: var(--cc);
  box-shadow: inset 0 0 0 0 #fff; vertical-align: middle; transition: transform .12s; }
.matrix tbody td.cell.hicell .mark { transform: scale(1.28); box-shadow: 0 0 0 3px rgba(0,211,173,0.25); }
.matrix tbody tr.modrow:last-child td.cell { border-bottom: 1px solid var(--ps-neutral-100); }
.matrix tbody td.gsep, .matrix thead th.gsep { border-left: 2px solid var(--ps-neutral-200); }
.matrix-readout { display: flex; align-items: center; gap: 12px; min-height: 26px; margin: 18px 2px 0; font-size: 0.9rem; color: var(--ps-neutral-400); }
.matrix-readout b { color: var(--ps-primary-400); font-family: var(--ps-font-secondary); }

/* ---------------- By skill ---------------- */
.skillgroup + .skillgroup { margin-top: 36px; }
.skillgroup .gtitle { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
.skillgroup .gtitle h3 { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 1.2rem; color: var(--ps-primary-400); margin: 0; }
.skillgroup .gtitle span { font-size: 0.84rem; color: var(--ps-neutral-300); }
.skill-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 14px 4px;
  border-top: 1px solid var(--ps-neutral-100); transition: opacity .2s; }
.skill-row:last-child { border-bottom: 1px solid var(--ps-neutral-100); }
.skill-row .nm { font-family: var(--ps-font-secondary); font-weight: 700; color: var(--ps-primary-400); font-size: 1rem; }
.skill-row .cnt { font-size: 0.74rem; color: var(--ps-neutral-300); margin-left: 10px; font-weight: 400; }
.skill-row .track { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
.skill-row .track b { width: 26px; height: 26px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.72rem; color: #fff; background: var(--cc); transition: opacity .2s; }
.skill-row .track b.dim { opacity: 0.22; }
.skill-row .rt { display: flex; align-items: center; gap: 12px; }
.skill-row .lens-tag { font-family: var(--ps-font-secondary); font-weight: 700; font-size: 0.64rem; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--ps-accent1-500); background: var(--ps-accent1-50); border: 1px solid var(--ps-accent1-100);
  padding: 4px 10px; border-radius: 99px; white-space: nowrap; }

/* ---------------- Footer ---------------- */
.report-foot { padding: 40px var(--pad-x) 54px; border-top: 1px solid var(--gap-line);
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.report-foot .l { display: flex; align-items: center; gap: 14px; }
.report-foot .tag { font-size: 0.84rem; color: var(--ps-neutral-400); line-height: 1.5; }
.report-foot .tag b { color: var(--ps-primary-400); font-family: var(--ps-font-secondary); font-weight: 700; }

/* ---------------- Responsive ---------------- */
@media (max-width: 900px) {
  :root { --pad-x: 32px; }
  .cover h1 { font-size: 2.8rem; }
  .intro-grid, .cov { grid-template-columns: 1fr; gap: 32px; }
  .toolbar nav { display: none; }
}

/* ============================================================
   PRINT — clean paged document
   ============================================================ */
@media print {
  @page { size: Letter portrait; margin: 14mm 12mm; }
  body { background: #fff; }
  .toolbar, .filterbar, .matrix-readout { display: none !important; }
  .sheet-wrap { padding: 0; }
  .sheet { max-width: none; box-shadow: none; border-radius: 0; }
  section.report-sec { padding: 26px 0; border-top: 1px solid var(--ps-neutral-150); break-inside: avoid-page; }
  .cover { padding: 40px 32px; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cover h1 { font-size: 3rem; }
  #journey { break-before: page; }
  #matrix { break-before: page; }
  #byskill { break-before: page; }
  .band, .mod-card, .skill-row, .tier, .gap-card, .skillgroup { break-inside: avoid; }
  .band.dim, .matrix tbody tr.modrow.dim { opacity: 1 !important; }   /* never print dimmed */
  .matrix-scroll { overflow: visible; border: none; }
  table.matrix { font-size: 0.6rem; }
  table.matrix col.labelcol { width: 152px; }
  table.matrix col.skillcol { width: 23px; }
  .matrix tbody tr.modrow th { font-size: 0.66rem; padding: 0 8px 0 12px; max-width: 152px; }
  .matrix thead .skillrow th .rot { font-size: 0.6rem; }
  .matrix thead .skillrow th.corner { font-size: 0.58rem; padding-left: 12px; }
  .matrix tbody .certlabel td { padding-left: 12px; }

  <script>
/* ============================================================
   NM Product Manager Skills Journey — data model (v2 · FINAL)
   20 modules across 4 Product School certifications covering
   ALL 23 Northwestern Mutual PM competency skills.
   Source: NM Final Program Recommendation.

   Cumulative coverage arc:
     Product Management ....... 17 / 23
     + Product Leadership ..... 21 / 23  (4 new)
     + AI Product Management .. 21 / 23  (0 new — deepens with an AI lens)
     + AI Evals (2 modules) ... 23 / 23  (2 new)
   ============================================================ */
(function () {
  // --- Certifications ----------------------------------------
  const CERTS = {
    PMC: {
      key: "PMC", name: "Product Management Certification", short: "Product Management",
      tagline: "Foundations — with AI woven through the lifecycle",
      modules: 6, accentVar: "--ps-primary-300", tintVar: "--ps-primary-50",
      aiWoven: true,
    },
    PL: {
      key: "PL", name: "Product Leadership Certification", short: "Product Leadership",
      tagline: "Strategy, organization & stakeholders",
      modules: 6, accentVar: "--ps-accent4-400", tintVar: "--ps-accent4-50",
    },
    AIPM: {
      key: "AIPM", name: "AI Product Management Certification", short: "AI Product Management",
      tagline: "Deepens existing skills with an AI lens",
      modules: 6, accentVar: "--ps-accent2-400", tintVar: "--ps-accent2-50",
      reinforcesOnly: true,
    },
    AIEVALS: {
      key: "AIEVALS", name: "AI Evals Certification", short: "AI Evals",
      tagline: "Trust & responsible AI — the final two skills",
      modules: 2, accentVar: "--ps-accent3-400", tintVar: "--ps-accent3-50",
      partial: true, partialNote: "2 targeted modules",
    },
  };
  const CERT_ORDER = ["PMC", "PL", "AIPM", "AIEVALS"];

  // --- The 23 NM skills, by tier -----------------------------
  const SKILL_CATALOG = {
    foundational: [
      "Agile Leadership", "Agile Results Delivery", "Change Adaptability",
      "Cross Functional Partnering & Planning", "Emotional Intelligence",
      "Stakeholder Relationship", "Technical & Digital Acumen",
    ],
    roleSpecific: [
      "Agile Product Ownership", "Analytical Thinking", "Architecture & Technology Planning",
      "Business Application", "Change Management", "Coaching & Mentoring",
      "Continuous Improvement", "Customer Centricity", "Development & Delivery Methodologies",
      "Domain Expertise", "End-User Advocacy", "IT Strategy",
      "Learning Agility & Critical Thinking", "Production Planning",
      "Technical Leadership", "Vision Setting",
    ],
  };

  // --- The 20 modules ----------------------------------------
  // skills[]  = primary anchors (solid marks in the matrix)
  // Module-level skill placement is drawn from the certification's
  // confirmed skill list + module titles; tune freely.
  const MODULES = [
    { n: 1,  cert: "PMC", courseModule: "Module 1", title: "Develop Strategic Product Thinking",
      desc: "Establish the mindset, core responsibilities, and strategic foundation of a modern product manager.",
      skills: ["Agile Leadership", "Emotional Intelligence", "Technical & Digital Acumen", "Learning Agility & Critical Thinking", "Vision Setting"] },
    { n: 2,  cert: "PMC", courseModule: "Module 2", title: "Identify Signals for High-Value Opportunities",
      desc: "Turn customer and market signals into validated, high-value product opportunities.",
      skills: ["Business Application", "Customer Centricity", "Domain Expertise", "End-User Advocacy"] },
    { n: 3,  cert: "PMC", courseModule: "Module 3", title: "Make Data-Driven Product Decisions",
      desc: "Move from intuition to evidence — metrics, analytics, and experimentation that guide decisions.",
      skills: ["Analytical Thinking", "Continuous Improvement", "IT Strategy"] },
    { n: 4,  cert: "PMC", courseModule: "Module 4", title: "Define Product Requirements That Drive Execution",
      desc: "Write requirements and PRDs that translate strategy into shippable, well-architected work.",
      skills: ["Agile Product Ownership", "Architecture & Technology Planning", "Development & Delivery Methodologies"] },
    { n: 5,  cert: "PMC", courseModule: "Module 5", title: "Build Effective Product Roadmaps",
      desc: "Sequence and plan delivery with roadmaps that balance vision, capacity, and outcomes.",
      skills: ["Agile Results Delivery", "Production Planning"] },
    { n: 6,  cert: "PMC", courseModule: "Module 6", title: "Launch, Measure, and Iterate for Long-Term Success",
      desc: "Ship, measure impact, and iterate — closing the loop for sustained product success.",
      skills: ["Agile Results Delivery", "Continuous Improvement"] },

    { n: 7,  cert: "PL", courseModule: "Module 1", title: "Craft and Execute an Advanced Product Strategy",
      desc: "Set a defensible product vision and strategy, and align execution behind it.",
      skills: ["Analytical Thinking", "Vision Setting"] },
    { n: 8,  cert: "PL", courseModule: "Module 2", title: "Drive Alignment and Secure Executive Buy-In",
      desc: "Build cross-functional alignment and earn executive sponsorship for the roadmap.",
      skills: ["Cross Functional Partnering & Planning", "Emotional Intelligence", "Stakeholder Relationship"] },
    { n: 9,  cert: "PL", courseModule: "Module 3", title: "Build a High-Performing Product Culture",
      desc: "Lead, coach, and grow product teams — the people side of product leadership.",
      skills: ["Change Management", "Coaching & Mentoring"] },
    { n: 10, cert: "PL", courseModule: "Module 4", title: "Make Strategic Bets Backed by Product Financials",
      desc: "Connect product decisions to business and financial outcomes to justify strategic bets.",
      skills: ["Business Application"] },
    { n: 11, cert: "PL", courseModule: "Module 5", title: "Orchestrate a High-Impact Product Portfolio",
      desc: "Plan and balance investment across a portfolio of products and initiatives.",
      skills: ["Production Planning"] },
    { n: 12, cert: "PL", courseModule: "Module 6", title: "Leverage Analytics and Experimentation for Growth",
      desc: "Use analytics and experimentation programs to drive durable product growth.",
      skills: ["Analytical Thinking", "Continuous Improvement"] },

    { n: 13, cert: "AIPM", courseModule: "Module 1", title: "Develop an AI-First Product Mindset",
      desc: "Adopt an AI-first lens across the product lifecycle and identify where AI creates value.",
      skills: ["Technical & Digital Acumen", "Development & Delivery Methodologies", "Domain Expertise"] },
    { n: 14, cert: "AIPM", courseModule: "Module 2", title: "Fast-Track the Product Lifecycle with Prompt Engineering",
      desc: "Use prompt engineering to accelerate discovery, definition, and delivery.",
      skills: ["Technical & Digital Acumen", "Architecture & Technology Planning", "IT Strategy"] },
    { n: 15, cert: "AIPM", courseModule: "Module 3", title: "Define Advanced Product Requirements for the AI Era",
      desc: "Specify AI product requirements — data, retrieval, and model behavior — with precision.",
      skills: ["Technical & Digital Acumen", "Agile Product Ownership", "Architecture & Technology Planning"] },
    { n: 16, cert: "AIPM", courseModule: "Module 4", title: "Design AI-Native User Experiences",
      desc: "Design intelligent, AI-native experiences that earn user trust and adoption.",
      skills: ["Technical & Digital Acumen", "Customer Centricity", "End-User Advocacy"] },
    { n: 17, cert: "AIPM", courseModule: "Module 5", title: "Build AI Agents to Automate & Scale",
      desc: "Move from prompts to autonomous agents and workflows that automate and scale.",
      skills: ["Technical & Digital Acumen"] },
    { n: 18, cert: "AIPM", courseModule: "Module 6", title: "Calibrate AI Evals for Performance & Trust",
      desc: "Define evaluation criteria that keep AI products performant and trustworthy.",
      skills: ["Technical & Digital Acumen"] },

    { n: 19, cert: "AIEVALS", courseModule: "Module 5", title: "Scale Evals Across Product Lines",
      desc: "Build business-ready eval infrastructure — monitoring drift, bias, and fairness at scale.",
      skills: ["Change Adaptability", "Continuous Improvement"] },
    { n: 20, cert: "AIEVALS", courseModule: "Module 6", title: "Champion a Culture of Responsible AI",
      desc: "Embed responsible-AI practice and lead the organization toward trustworthy AI products.",
      skills: ["Technical Leadership"] },
  ];

  // --- Reinforcement (skill deepened, not first introduced) ---
  // AI PM cert deepens these 10 skills with an AI lens (cert-level,
  // Program Objective #4). AI Evals reinforces a short list too.
  const REINFORCE = {
    AIPM: [
      "Technical & Digital Acumen", "Architecture & Technology Planning",
      "Agile Product Ownership", "Development & Delivery Methodologies",
      "Customer Centricity", "End-User Advocacy", "IT Strategy",
      "Analytical Thinking", "Continuous Improvement", "Domain Expertise",
    ],
    AIEVALS: [
      "Cross Functional Partnering & Planning", "Stakeholder Relationship",
      "Vision Setting", "Continuous Improvement", "Emotional Intelligence",
    ],
  };

  // --- Derived structures ------------------------------------
  const ALL_SKILLS = [...SKILL_CATALOG.foundational, ...SKILL_CATALOG.roleSpecific];

  const skillToModules = {};
  ALL_SKILLS.forEach((s) => (skillToModules[s] = []));
  MODULES.forEach((m) => m.skills.forEach((s) => skillToModules[s] && skillToModules[s].push(m.n)));

  // certs that reinforce each skill
  const skillReinforcedBy = {};
  ALL_SKILLS.forEach((s) => (skillReinforcedBy[s] = []));
  Object.keys(REINFORCE).forEach((cert) =>
    REINFORCE[cert].forEach((s) => skillReinforcedBy[s] && skillReinforcedBy[s].push(cert))
  );

  const skillCategoryOf = (s) =>
    SKILL_CATALOG.foundational.includes(s) ? "foundational" : "roleSpecific";
  const certOf = (n) => (MODULES.find((m) => m.n === n) || {}).cert;

  const coveredCount = ALL_SKILLS.filter((s) => skillToModules[s].length > 0).length;

  // cumulative coverage by certification (for the build viz)
  const cumulative = (() => {
    const seen = new Set();
    return CERT_ORDER.map((k) => {
      const before = seen.size;
      MODULES.filter((m) => m.cert === k).forEach((m) =>
        m.skills.forEach((s) => seen.add(s))
      );
      return { cert: k, added: seen.size - before, total: seen.size };
    });
  })();

  window.NM_DATA = {
    CERTS, CERT_ORDER, SKILL_CATALOG, ALL_SKILLS, MODULES, REINFORCE,
    skillToModules, skillReinforcedBy, skillCategoryOf, certOf, cumulative,
    stats: {
      moduleCount: MODULES.length,           // 20
      certCount: CERT_ORDER.length,           // 4
      skillCount: ALL_SKILLS.length,          // 23
      coveredCount,                           // 23
    },
  };
})();

const Dm = window.NM_DATA;

const FOUND_N = Dm.SKILL_CATALOG.foundational.length;

Dm.MODULES.forEach((m) => { MOD_CERT[m.n] = m.cert; });
const CERT_SHORT = (k) => Dm.CERTS[k].short;

/* ---------------- Coverage matrix ---------------- */
function Matrix({ active }) {
  const [hover, setHover] = React.useState(null);
  const hCol = hover && hover.col != null ? hover.col : null;
  const hRow = hover && hover.row != null ? hover.row : null;

  let readout = "Hover any cell, or a skill label, to inspect a mapping.";
  if (hover) {
    if (hover.row != null && hover.col != null) {
      const m = Dm.MODULES.find((x) => x.n === hover.row);
      const sk = SKILL_COLS[hover.col];
      const has = m.skills.includes(sk);
      readout = has
        ? <span><b>Module {hover.row} · {m.title}</b> develops <b>{sk}</b>.</span>
        : <span>Module {hover.row} does not anchor <b>{sk}</b>.</span>;
    } else if (hover.col != null) {
      const sk = SKILL_COLS[hover.col];
      const mods = Dm.skillToModules[sk];
      const rein = Dm.skillReinforcedBy[sk];
      readout = (
        <span>
          <b>{sk}</b> — anchored by <b>{mods.length}</b> module{mods.length > 1 ? "s" : ""} ({mods.join(", ")})
          {rein.length > 0 && <span> · deepened with an AI lens in {rein.map(CERT_SHORT).join(" & ")}</span>}.
        </span>
      );
    }
  }

  return (
    <section className="report-sec" id="matrix" data-screen-label="Coverage matrix">
      <p className="sec-eyebrow">The mapping</p>
      <h2 className="sec-title">Coverage matrix</h2>
      <p className="sec-lede">All 20 modules against all 23 Northwestern Mutual skills. Dot color denotes the certification. Hover to inspect; filter to focus.</p>
      <CertFilter active={active} />
      <div className="matrix-scroll">
        <table className="matrix" onMouseLeave={() => setHover(null)}>
          <colgroup>
            <col className="labelcol" />
            {SKILL_COLS.map((_, i) => <col key={i} className="skillcol" />)}
          </colgroup>
          <thead>
            <tr className="grouprow">
              <th></th>
              <th colSpan={FOUND_N}><div className="ghead">Foundational</div></th>
              <th colSpan={SKILL_COLS.length - FOUND_N}><div className="ghead" style={{ marginLeft: 6 }}>Role-specific</div></th>
            </tr>
            <tr className="skillrow">
              <th className="corner">Module ↓ &nbsp; Skill →</th>
              {SKILL_COLS.map((sk, i) => (
                <th key={sk} className={(i === FOUND_N ? "gsep " : "") + (hCol === i ? "colhi" : "")}
                    onMouseEnter={() => setHover({ col: i })}>
                  <span className="rot">{sk}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {CERT_ORDER.map((k) => {
              const c = Dm.CERTS[k];
              const mods = Dm.MODULES.filter((m) => m.cert === k);
              const dim = !active[k];
              return (
                <React.Fragment key={k}>
                  <tr className="certlabel" style={certVars(k)}>
                    <td colSpan={SKILL_COLS.length + 1}>
                      <span className="cl"><span className="arch"></span>{c.name}</span>
                    </td>
                  </tr>
                  {mods.map((m) => (
                    <tr key={m.n}
                        className={"modrow" + (dim ? " dim" : "") + (hRow === m.n ? " rowhi" : "")}
                        style={certVars(k)}>
                      <th title={m.title}><span className="mn">{m.n}</span>{m.title}</th>
                      {SKILL_COLS.map((sk, i) => {
                        const on = m.skills.includes(sk);
                        const hi = hCol === i;
                        const cellHi = hRow === m.n && hCol === i;
                        return (
                          <td key={sk}
                              className={"cell" + (i === FOUND_N ? " gsep" : "") + (hi ? " colhi" : "") + (cellHi ? " hicell" : "")}
                              onMouseEnter={() => setHover({ row: m.n, col: i })}>
                            {on && <span className="mark"></span>}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="matrix-readout">{readout}</div>
    </section>
  );
}

function ProgramTimeline() {
  // ── Batch Gantt ───────────────────────────────────────────────
  const SPAN = 22; // months: Jan 2027 to Oct 2028
  const DUR  = 9.69; // 42 weeks in months
  const px   = (m) => (m / SPAN * 100).toFixed(2) + '%';

  const ticks = [
    { label: "Jan '27", m: 0 },
    { label: "Jul '27", m: 6 },
    { label: "Jan '28", m: 12 },
    { label: "Jul '28", m: 18 },
    { label: "Oct '28", m: 21.6 },
  ];

  const batches = [
    { label: "Batch 1", sub: "100 participants, 4 cohorts, starting Jan 2027", start: 0 },
    { label: "Batch 2", sub: "100 participants, 4 cohorts, starting Jul 2027",  start: 6 },
    { label: "Batch 3", sub: "100 participants, 4 cohorts, starting Jan 2028", start: 12 },
  ];

  const phases = [
    { label: "Core Skills",        color: "#1A2B6B" },
    { label: "Product Leadership", color: "#6767E5" },
    { label: "Scale & AI",         color: "#1397A8" },
  ];

  // ── Week-by-week detail (Batch 1) ─────────────────────────────
  // Per course: Train Coach × 6, then Capstone Prep Coaching, then Capstone Demo Day = 14 weeks
  const buildCourse = (ci) => {
    const out = [];
    let wk = ci * 14 + 1;
    for (let m = 0; m < 6; m++) {
      out.push({ type: 'train', wk: wk++ });
      out.push({ type: 'coach', wk: wk++, prep: false });
    }
    out.push({ type: 'coach', wk: wk++, prep: true });
    out.push({ type: 'demo',  wk: wk++ });
    return out;
  };

  const courses = [
    { label: "Phase 1: Core Skills",        span: "Weeks 1–14",  color: "#1A2B6B", tint: "rgba(26,43,107,0.07)",   ring: "rgba(26,43,107,0.18)",   weeks: buildCourse(0) },
    { label: "Phase 2: Product Leadership", span: "Weeks 15–28", color: "#6767E5", tint: "rgba(103,103,229,0.07)", ring: "rgba(103,103,229,0.18)", weeks: buildCourse(1) },
    { label: "Phase 3: Scale & AI",         span: "Weeks 29–42", color: "#1397A8", tint: "rgba(19,151,168,0.07)",  ring: "rgba(19,151,168,0.18)",  weeks: buildCourse(2) },
  ];

  const cellStyle = (w, c) => {
    if (w.type === 'train') return { background: c.color, color: 'rgba(255,255,255,0.92)' };
    if (w.type === 'coach') return { background: c.tint, color: c.color, border: `1px solid ${c.ring}` };
    return { background: 'var(--ps-accent1-300)', color: 'var(--ps-primary-500)' };
  };

  const L = { fontFamily: 'var(--ps-font-secondary)', fontWeight: 700 };

  return (
    <div>

      {/* ── Part 1: Batch Overview ── */}
      <div style={{ marginBottom: '44px' }}>
        <div style={{ ...L, fontSize: '0.68rem', textTransform: 'uppercase', letterSpacing: '0.09em', color: 'var(--ps-neutral-300)', marginBottom: '18px' }}>
          All 3 batches · Jan 2027 to Oct 2028
        </div>
        {/* Month axis */}
        <div style={{ marginLeft: '180px' }}>
          <div style={{ position: 'relative', height: '20px', marginBottom: '6px' }}>
            {ticks.map(t => (
              <div key={t.m} style={{ position: 'absolute', left: px(t.m), transform: 'translateX(-50%)' }}>
                <span style={{ ...L, fontSize: '0.62rem', textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--ps-neutral-300)', whiteSpace: 'nowrap' }}>{t.label}</span>
              </div>
            ))}
          </div>
          <div style={{ height: '1px', background: 'var(--ps-neutral-150)', marginBottom: '14px' }}></div>
        </div>
        {/* Rows */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
          {batches.map(b => (
            <div key={b.label} style={{ display: 'flex', alignItems: 'center' }}>
              <div style={{ width: '180px', flex: 'none', paddingRight: '20px' }}>
                <div style={{ ...L, fontSize: '0.82rem', color: 'var(--ps-primary-400)' }}>{b.label}</div>
                <div style={{ fontSize: '0.68rem', color: 'var(--ps-neutral-300)', marginTop: '3px', lineHeight: 1.4 }}>{b.sub}</div>
              </div>
              <div style={{ flex: 1, position: 'relative', height: '50px' }}>
                <div style={{ position: 'absolute', inset: 0, background: 'var(--ps-neutral-25)', borderRadius: '10px' }}></div>
                <div style={{ position: 'absolute', left: px(b.start), width: px(DUR), top: 0, height: '100%', borderRadius: '10px', overflow: 'hidden', display: 'flex' }}>
                  {phases.map(p => (
                    <div key={p.label} style={{ width: '33.33%', background: p.color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <span style={{ ...L, fontSize: '0.6rem', color: 'rgba(255,255,255,0.88)', letterSpacing: '0.01em', textAlign: 'center', lineHeight: 1.2, padding: '0 4px' }}>{p.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
        {/* Phase legend */}
        <div style={{ display: 'flex', gap: '20px', marginTop: '14px', marginLeft: '180px' }}>
          {phases.map(p => (
            <div key={p.label} style={{ display: 'flex', alignItems: 'center', gap: '7px' }}>
              <div style={{ width: '10px', height: '10px', borderRadius: '2px', background: p.color, flexShrink: 0 }}></div>
              <span style={{ ...L, fontSize: '0.72rem', color: 'var(--ps-neutral-400)' }}>{p.label}</span>

          Batch 1 in detail · 42 weeks
        </div>

        {/* Week grid */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
          {courses.map((c, ci) => (

function smoothTo(id) {

  const top = el.getBoundingClientRect().top + window.scrollY - 64;
  window.scrollTo({ top, behavior: "smooth" });
}
